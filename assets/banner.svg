<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="820" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="820" height="220" fill="url(#bg)"/>

  <!-- glow orbs -->
  <circle cx="120" cy="60" r="80" fill="url(#glow1)" opacity="0.25" filter="url(#blur)"/>
  <circle cx="700" cy="170" r="90" fill="url(#glow2)" opacity="0.2" filter="url(#blur)"/>

  <!-- grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="44" x2="820" y2="44"/>
    <line x1="0" y1="88" x2="820" y2="88"/>
    <line x1="0" y1="132" x2="820" y2="132"/>
    <line x1="0" y1="176" x2="820" y2="176"/>
    <line x1="137" y1="0" x2="137" y2="220"/>
    <line x1="274" y1="0" x2="274" y2="220"/>
    <line x1="410" y1="0" x2="410" y2="220"/>
    <line x1="547" y1="0" x2="547" y2="220"/>
    <line x1="684" y1="0" x2="684" y2="220"/>
  </g>

  <!-- name -->
  <text x="410" y="95" text-anchor="middle" font-family="ui-monospace, SF Mono, Monaco, monospace" font-size="42" font-weight="700" fill="#e2e8f0" letter-spacing="-1">
    Amirhossein Safaei
  </text>

  <!-- tagline -->
  <text x="410" y="130" text-anchor="middle" font-family="ui-monospace, SF Mono, Monaco, monospace" font-size="16" fill="#94a3b8" letter-spacing="3">
    PREMEDO · WEB · 3D · MUSIC
  </text>

  <!-- accent line -->
  <rect x="340" y="150" width="140" height="3" rx="1.5" fill="url(#glow1)" opacity="0.8"/>

  <!-- location -->
  <text x="410" y="180" text-anchor="middle" font-family="ui-monospace, SF Mono, Monaco, monospace" font-size="13" fill="#475569" letter-spacing="2">
    Mashhad, Iran · github.com/Amirhossein41148
  </text>
</svg>
